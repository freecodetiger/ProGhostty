name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should this work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else have you tried or thought about?
  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      options:
        - Terminal core (PTY, VT, renderer)
        - Smooth scrolling / history
        - Workspace / splits / panes
        - Settings / themes
        - AI CLI integration (notifications, side input)
        - Docs / onboarding
        - Other
    validations:
      required: true
