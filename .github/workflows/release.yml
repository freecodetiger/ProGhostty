name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    # Zig 0.15.2's build runner fails to link libc on macOS 26 / Xcode 26
    # (undefined _abort/_free/...). Pin until Zig catches up.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve build cache key
        id: build-cache-key
        run: |
          set -euo pipefail
          # The VT library's recorded commit and the local patch are the only
          # inputs that make the Zig caches stale. Zig's cache is content
          # addressed, so a restored cache is always safe to reuse.
          echo "vt=$(git ls-tree HEAD Vendor/ghostty | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache-global
            Vendor/ghostty/.zig-cache
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-cache-key.outputs.vt }}-${{ hashFiles('Vendor/ghostty.patch') }}

      - name: Show toolchain
        run: |
          set -euxo pipefail
          uname -a
          swift --version
          xcode-select -p
          xcrun --show-sdk-path
          test -f Vendor/ghostty/build.zig

      - name: Install Zig
        run: |
          set -euxo pipefail
          mkdir -p .tools
          case "$(uname -m)" in
            arm64) ZIG_ARCH=aarch64 ;;
            x86_64) ZIG_ARCH=x86_64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fL "https://ziglang.org/download/0.15.2/zig-${ZIG_ARCH}-macos-0.15.2.tar.xz" -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools
          echo "${GITHUB_WORKSPACE}/.tools/zig-${ZIG_ARCH}-macos-0.15.2" >> "$GITHUB_PATH"
          ".tools/zig-${ZIG_ARCH}-macos-0.15.2/zig" version

      - name: Apply ProGhostty VT patch
        working-directory: Vendor/ghostty
        run: |
          set -euxo pipefail
          git apply ../ghostty.patch
          test -f include/ghostty/vt/terminal.h

      - name: Build Ghostty VT
        working-directory: Vendor/ghostty
        run: |
          set -euxo pipefail
          export SDKROOT="$(xcrun --show-sdk-path)"
          zig build \
            --global-cache-dir "${GITHUB_WORKSPACE}/.zig-cache-global" \
            -Demit-lib-vt=true \
            -Demit-xcframework=false \
            -Doptimize=ReleaseFast
          test -f zig-out/lib/libghostty-vt.a

      - name: Architecture guard
        run: scripts/check-architecture.sh

      - name: Test
        run: swift test --no-parallel

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euxo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/proghostty-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          # The secret holds base64 so the binary .p12 survives a YAML round-trip.
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Without the partition list, codesign blocks on a keychain access
          # prompt and the job hangs until the runner times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          echo "NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and notarize the app bundle
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euxo pipefail
          # Build and notarize the app once for both artifacts. The DMG and ZIP
          # steps previously each built their own bundle and each submitted it to
          # Apple, costing a duplicate release build and a duplicate
          # notarization round-trip (~2 min) per release.
          APP_DIR="$(VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-app-bundle.sh release)"
          rm -rf dist/app
          mkdir -p dist/app
          # `ditto`, not `cp -R`: it preserves the extended attributes the code
          # signature seals. The app is stapled here and never copied again.
          ditto "$APP_DIR" dist/app/ProGhostty.app
          ln -s /Applications dist/app/Applications
          if [ -n "${SIGNING_IDENTITY:-}" ]; then
            scripts/notarize.sh dist/app/ProGhostty.app
          fi
          echo "APP_STAGING_DIR=$PWD/dist/app" >> "$GITHUB_ENV"

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          # Leave the secret unset for an Individual API key — notarytool
          # rejects an issuer it was not given one for.
          NOTARY_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Build ZIP
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          # Archives the already-notarized bundle from APP_STAGING_DIR; the
          # signing/notary variables above only matter for a local fallback run.
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-zip.sh release

      - name: Verify notarization is stapled and Gatekeeper accepts it
        run: |
          set -euxo pipefail
          DMG="$(ls dist/*.dmg)"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          # The ZIP carries no ticket of its own, so the shared app bundle both
          # artifacts were cut from must still be stapled.
          xcrun stapler validate dist/app/ProGhostty.app

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true

  deploy-site:
    name: Redeploy download page
    needs: macos-dmg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          repository: freecodetiger/ProGhostty-release
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Fetch latest release info (embed at build time)
        run: |
          curl -sS -H "Accept: application/vnd.github+json" \
            -H "User-Agent: ProGhostty-CI" \
            "https://api.github.com/repos/freecodetiger/ProGhostty/releases/latest" \
            | jq '{tag_name, assets: [.assets[]? | {name, browser_download_url}]}' \
            > public/release.json
          echo "Embedded release:" && cat public/release.json
      - run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync dist to server
        run: |
          rsync -az --delete --exclude='*.dmg' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ "root@${{ secrets.DEPLOY_HOST }}:/var/www/proghostty/"
