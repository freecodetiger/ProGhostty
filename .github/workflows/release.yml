name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Swift toolchain
        run: swift --version

      - name: Install Zig
        run: |
          mkdir -p .tools
          curl -L https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools

      - name: Build Ghostty VT
        run: |
          cd Vendor/ghostty
          ../../.tools/zig-aarch64-macos-0.15.2/zig build \
            --global-cache-dir ../../.zig-cache-global \
            -Demit-lib-vt=true

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版 DMG 构建。

            更新重点：
            - 接入真实 PTY 会话，并继续稳定 Ghostty VT cell-grid 渲染链路。
            - 修复像素级滚动下文本选择区域和可见文本行列不一致的问题。
            - 增加 URL 识别与 `⌘ + 点击` 打开链接，普通点击仍优先服务于文本选择。
            - 鼠标悬停链接时提供克制的 titlebar 提示，降低“可点击但需要修饰键”的认知断层。
            - 改进工作区、分屏、布局尺寸和持久化相关逻辑。
            - 继续保留分屏、工作区、设置、插件管理和自动检查更新能力。

            安装说明：
            - 下载 DMG 后拖拽安装即可。
            - 当前版本使用 ad-hoc 签名，macOS 可能提示开发者无法验证；如遇提示，请在系统设置中允许打开。
