name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Swift toolchain
        run: swift --version

      - name: Install Zig
        run: |
          mkdir -p .tools
          curl -L https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools

      - name: Build Ghostty VT
        run: |
          cd Vendor/ghostty
          ../../.tools/zig-aarch64-macos-0.15.2/zig build \
            --global-cache-dir ../../.zig-cache-global \
            -Demit-lib-vt=true

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版 DMG 构建。

            更新重点：
            - 修复 Codex 等 TUI 中多行粘贴被逐行发送的问题，按 bracketed paste 模式编码粘贴内容。
            - 修复分屏场景下 Cmd+V 可能被第一个 pane 抢占的问题，粘贴会进入当前聚焦 pane。
            - 修复 Esc、Ctrl+C 等控制键在 cell-grid 渲染路径下的输入处理。
            - 改进 Codex 流式输出期间的历史滚动稳定性，降低滚动抖动和内容跳动。
            - 支持拖选文本到边缘时自动按行滚动，并在拖选期间避免流式输出替换当前选择区域。

            安装说明：
            - 下载 DMG 后拖拽安装即可。
            - 当前版本使用 ad-hoc 签名，macOS 可能提示开发者无法验证；如遇提示，请在系统设置中允许打开。
