name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          set -euxo pipefail
          uname -a
          swift --version
          xcode-select -p
          xcrun --show-sdk-path
          test -f Vendor/ghostty/build.zig

      - name: Install Zig
        run: |
          set -euxo pipefail
          mkdir -p .tools
          case "$(uname -m)" in
            arm64) ZIG_ARCH=aarch64 ;;
            x86_64) ZIG_ARCH=x86_64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fL "https://ziglang.org/download/0.15.2/zig-${ZIG_ARCH}-macos-0.15.2.tar.xz" -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools
          echo "${GITHUB_WORKSPACE}/.tools/zig-${ZIG_ARCH}-macos-0.15.2" >> "$GITHUB_PATH"
          ".tools/zig-${ZIG_ARCH}-macos-0.15.2/zig" version

      - name: Build Ghostty VT
        working-directory: Vendor/ghostty
        run: |
          set -euxo pipefail
          zig build \
            --global-cache-dir "${GITHUB_WORKSPACE}/.zig-cache-global" \
            -Demit-lib-vt=true \
            -Demit-xcframework=false \
            -Doptimize=ReleaseFast
          test -f zig-out/lib/libghostty-vt.a

      - name: Architecture guard
        run: scripts/check-architecture.sh

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版。

            ## 高光：Pattern-2 平滑滚动重构
            - 全新像素级平滑滚动（`SmoothScrollEngine` + display-link browse tick），浏览位置与 VT viewport 解耦。
            - Metal 直绘 expanded grid（去掉 offscreen composite），亚行偏移一次清屏直达 drawable。
            - 浏览历史时继续跟随底部新输出；回底更稳健；软边界 + 惯性取近期峰值速度。
            - 下线 pattern-1 死路径与 history freeze，去掉双写 `visualOffsetY` 类滚动抖动根因。
            - 最低系统版本抬到 **macOS 14**。

            ## 其它
            - 设置页侧边栏 + 条目级搜索，字体相关设置重整。
            - 通知收敛为 Agent 任务完成场景；移除插件管理 / shell-enhancements。
            - Core/App 分层加固、`PaneWorkspaceController` 唯一布局 owner、PTY 输出延迟减半。
            - CI / 本地构建统一 `libghostty-vt` **ReleaseFast**，避免 VT 解析千倍变慢。
