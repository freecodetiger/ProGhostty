name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Swift toolchain
        run: swift --version

      - name: Install Zig
        run: |
          mkdir -p .tools
          curl -L https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools

      - name: Build Ghostty VT
        run: |
          cd Vendor/ghostty
          ../../.tools/zig-aarch64-macos-0.15.2/zig build \
            --global-cache-dir ../../.zig-cache-global \
            -Demit-lib-vt=true

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版。

            更新内容：
            - 修复 Codex 输入 `/res` 等命令时，终端 transient cursor 帧导致光标短暂跳到输入行左上方的问题。
            - 修复长输入自动换行瞬间，prompt continuation 行的光标可能短暂漂移的问题。
            - 增加 Metal 直渲染路径诊断日志与缓存/滚动性能指标，沉淀当前渲染路径和后续优化计划。
