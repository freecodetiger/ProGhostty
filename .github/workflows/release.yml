name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    # Zig 0.15.2's build runner fails to link libc on macOS 26 / Xcode 26
    # (undefined _abort/_free/...). Pin until Zig catches up.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          set -euxo pipefail
          uname -a
          swift --version
          xcode-select -p
          xcrun --show-sdk-path
          test -f Vendor/ghostty/build.zig

      - name: Install Zig
        run: |
          set -euxo pipefail
          mkdir -p .tools
          case "$(uname -m)" in
            arm64) ZIG_ARCH=aarch64 ;;
            x86_64) ZIG_ARCH=x86_64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fL "https://ziglang.org/download/0.15.2/zig-${ZIG_ARCH}-macos-0.15.2.tar.xz" -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools
          echo "${GITHUB_WORKSPACE}/.tools/zig-${ZIG_ARCH}-macos-0.15.2" >> "$GITHUB_PATH"
          ".tools/zig-${ZIG_ARCH}-macos-0.15.2/zig" version

      - name: Build Ghostty VT
        working-directory: Vendor/ghostty
        run: |
          set -euxo pipefail
          export SDKROOT="$(xcrun --show-sdk-path)"
          zig build \
            --global-cache-dir "${GITHUB_WORKSPACE}/.zig-cache-global" \
            -Demit-lib-vt=true \
            -Demit-xcframework=false \
            -Doptimize=ReleaseFast
          test -f zig-out/lib/libghostty-vt.a

      - name: Architecture guard
        run: scripts/check-architecture.sh

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版。

            ## v0.4.1 · Pattern-2 滚动与选区修复
            - **假底部 / 吸附**：距底锚点 + 中途 live bottom 刷新，小幅下滚不再误回 live；能滚穿历史到真尾。
            - **选区错位 / 选不上**：Metal 选区行已在 expanded 坐标，去掉重复 `selectionRowsOffset`（浏览差 1 行、live 大 overscan 高亮飞出）。
            - **滚动卡死 + 光标狂闪**：browse 期间跳过 O(rows×cols) cursor-rect 重建；异步 present 时 GPU 忙则丢帧，不堵主线程。
            - CI 继续 pin **macos-15**，`libghostty-vt` **ReleaseFast**。

            ## 自 v0.4.0
            - Pattern-2 平滑像素滚动、Metal 直绘 expanded grid、浏览时跟随新输出。
            - 最低系统版本 **macOS 14**。
