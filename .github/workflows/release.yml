name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Swift toolchain
        run: swift --version

      - name: Install Zig
        run: |
          mkdir -p .tools
          curl -L https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools

      - name: Build Ghostty VT
        run: |
          cd Vendor/ghostty
          ../../.tools/zig-aarch64-macos-0.15.2/zig build \
            --global-cache-dir ../../.zig-cache-global \
            -Demit-lib-vt=true

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版。

            更新内容：
            - 修复 PTY session 非 UTF-8 locale 导致的中文输入回显乱码。
            - 优化输入写入与渲染顺序，降低 live bottom 普通按键延迟。
            - 改进近期 shell echo 的 immediate 渲染判定，提升中文和 prompt repaint 回显响应。
            - 保留历史区输入时自动回到底部的行为。
