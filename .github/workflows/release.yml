name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    # Zig 0.15.2's build runner fails to link libc on macOS 26 / Xcode 26
    # (undefined _abort/_free/...). Pin until Zig catches up.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          set -euxo pipefail
          uname -a
          swift --version
          xcode-select -p
          xcrun --show-sdk-path
          test -f Vendor/ghostty/build.zig

      - name: Install Zig
        run: |
          set -euxo pipefail
          mkdir -p .tools
          case "$(uname -m)" in
            arm64) ZIG_ARCH=aarch64 ;;
            x86_64) ZIG_ARCH=x86_64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fL "https://ziglang.org/download/0.15.2/zig-${ZIG_ARCH}-macos-0.15.2.tar.xz" -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools
          echo "${GITHUB_WORKSPACE}/.tools/zig-${ZIG_ARCH}-macos-0.15.2" >> "$GITHUB_PATH"
          ".tools/zig-${ZIG_ARCH}-macos-0.15.2/zig" version

      - name: Build Ghostty VT
        working-directory: Vendor/ghostty
        run: |
          set -euxo pipefail
          export SDKROOT="$(xcrun --show-sdk-path)"
          zig build \
            --global-cache-dir "${GITHUB_WORKSPACE}/.zig-cache-global" \
            -Demit-lib-vt=true \
            -Demit-xcframework=false \
            -Doptimize=ReleaseFast
          test -f zig-out/lib/libghostty-vt.a

      - name: Architecture guard
        run: scripts/check-architecture.sh

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版。

            ## v0.4.5 · URL 语义对象交互
            - **停留唤醒（dwell）**：鼠标停在链接/路径上约 60ms，整段（含跨行）原地加粗——只改字重、不位移、不染色；快速划过无反应。再停一会儿末尾淡入 `↗`。
            - **圆环光标**：移到可交互对象上，指针变成一枚干净圆环（独立 CALayer 合成，跟手不卡）；随背景明暗自动取深/浅两色。
            - **点击菜单**：单击链接弹出「在浏览器打开 / 复制链接」，路径为「在访达显示 / 复制路径」；⌘-click 直接打开。
            - **裸词路径**：无 `/` 前缀的文件/目录名，只要在当前 cwd 下真实存在也可点击。
            - **⌘ Explore**：按住 ⌘ 全屏点亮所有可交互对象；⌘+其他键或失焦即退出，不再卡在展开态。
            - **旁路输入（⌘P）**：输入框开启时终端对鼠标惰性，避免与悬停交互打架。
            - 修复：链接检测的正则/路径存在性缓存（消除悬停卡顿）、toast 重复点击不再只弹一次且能持续显示。

            ## 自 v0.4.4
            - 跨行链接 ⌘-click、设置窗标题黏底、Soft Light 正文字纯黑。

            ## 自 v0.4.3
            - 分屏拉伸/错位、reflow 闪动、关分屏崩溃、最后一块分屏误关、历史选区边缘滚动修复。

            ## 自 v0.4.0
            - Pattern-2 平滑像素滚动、Metal 直绘 expanded grid；最低 **macOS 14**。
