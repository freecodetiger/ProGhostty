name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    # Zig 0.15.2's build runner fails to link libc on macOS 26 / Xcode 26
    # (undefined _abort/_free/...). Pin until Zig catches up.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          set -euxo pipefail
          uname -a
          swift --version
          xcode-select -p
          xcrun --show-sdk-path
          test -f Vendor/ghostty/build.zig

      - name: Install Zig
        run: |
          set -euxo pipefail
          mkdir -p .tools
          case "$(uname -m)" in
            arm64) ZIG_ARCH=aarch64 ;;
            x86_64) ZIG_ARCH=x86_64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fL "https://ziglang.org/download/0.15.2/zig-${ZIG_ARCH}-macos-0.15.2.tar.xz" -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools
          echo "${GITHUB_WORKSPACE}/.tools/zig-${ZIG_ARCH}-macos-0.15.2" >> "$GITHUB_PATH"
          ".tools/zig-${ZIG_ARCH}-macos-0.15.2/zig" version

      - name: Build Ghostty VT
        working-directory: Vendor/ghostty
        run: |
          set -euxo pipefail
          export SDKROOT="$(xcrun --show-sdk-path)"
          zig build \
            --global-cache-dir "${GITHUB_WORKSPACE}/.zig-cache-global" \
            -Demit-lib-vt=true \
            -Demit-xcframework=false \
            -Doptimize=ReleaseFast
          test -f zig-out/lib/libghostty-vt.a

      - name: Architecture guard
        run: scripts/check-architecture.sh

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版。

            ## v0.4.3 · 分屏/滚动稳定性
            - **分屏拉伸/错位**：分屏与拖动分界线时，Metal 旧帧不再被拉伸；竖直改高时用底色过渡，避免内容先上移/下移再回正。
            - **分屏 reflow 闪动**：VT resize 后等 shell 重绘再统一 present，减少「到位后又刷一遍」。
            - **关分屏崩溃**：修复高度变化清屏在 Metal completion 队列触碰 MainActor 导致的闪退。
            - **最后一块分屏不可关**：只剩一个 pane 时不再误关整个工作区；菜单项禁用。
            - **历史选区边缘滚动**：默认平滑路径下拖选进历史走 Pattern-2 browse，不再错误移动 VT 视口。
            - Soft Dark 正文字改为纯白（用户偏好）。

            ## 自 v0.4.2
            - Soft Dark / Soft Light 整套预设与设置 chrome 同族配色。

            ## 自 v0.4.0
            - Pattern-2 平滑像素滚动、Metal 直绘 expanded grid；最低 **macOS 14**。
