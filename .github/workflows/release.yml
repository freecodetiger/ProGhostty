name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Swift toolchain
        run: swift --version

      - name: Install Zig
        run: |
          mkdir -p .tools
          curl -L https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools

      - name: Build Ghostty VT
        run: |
          cd Vendor/ghostty
          ../../.tools/zig-aarch64-macos-0.15.2/zig build \
            --global-cache-dir ../../.zig-cache-global \
            -Demit-lib-vt=true

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版。

            更新内容：
            - 新增每个 pane 独立的旁路输入框，支持快捷键呼出与草稿保留。
            - 优化 titlebar：工作区入口回到工作区管理，中间 cwd 悬停可展开显示。
            - 真实终端支持 Shift+Enter 换行，适合 Codex 等 TUI 的多行输入。
            - 改进分屏、粘贴和路径拖拽的交互稳定性。
