name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Swift toolchain
        run: swift --version

      - name: Install Zig
        run: |
          mkdir -p .tools
          curl -L https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools

      - name: Build Ghostty VT
        run: |
          cd Vendor/ghostty
          ../../.tools/zig-aarch64-macos-0.15.2/zig build \
            --global-cache-dir ../../.zig-cache-global \
            -Demit-lib-vt=true

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版 DMG 构建。

            更新重点：
            - 优化工作区管理界面，移除冗余目录信息，让切换浮层更紧凑。
            - 修复新分屏 cwd 继承问题，新 pane 会优先使用当前 pane 的真实工作目录。
            - 改进 resize/reflow 路径，降低复杂 TUI 场景下窗口调整时的阻塞感。
            - 继续稳定 PTY、Ghostty VT cell-grid 渲染、像素级滚动、分屏和工作区链路。

            安装说明：
            - 下载 DMG 后拖拽安装即可。
            - 当前版本使用 ad-hoc 签名，macOS 可能提示开发者无法验证；如遇提示，请在系统设置中允许打开。
