name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    # Zig 0.15.2's build runner fails to link libc on macOS 26 / Xcode 26
    # (undefined _abort/_free/...). Pin until Zig catches up.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          set -euxo pipefail
          uname -a
          swift --version
          xcode-select -p
          xcrun --show-sdk-path
          test -f Vendor/ghostty/build.zig

      - name: Install Zig
        run: |
          set -euxo pipefail
          mkdir -p .tools
          case "$(uname -m)" in
            arm64) ZIG_ARCH=aarch64 ;;
            x86_64) ZIG_ARCH=x86_64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fL "https://ziglang.org/download/0.15.2/zig-${ZIG_ARCH}-macos-0.15.2.tar.xz" -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools
          echo "${GITHUB_WORKSPACE}/.tools/zig-${ZIG_ARCH}-macos-0.15.2" >> "$GITHUB_PATH"
          ".tools/zig-${ZIG_ARCH}-macos-0.15.2/zig" version

      - name: Build Ghostty VT
        working-directory: Vendor/ghostty
        run: |
          set -euxo pipefail
          export SDKROOT="$(xcrun --show-sdk-path)"
          zig build \
            --global-cache-dir "${GITHUB_WORKSPACE}/.zig-cache-global" \
            -Demit-lib-vt=true \
            -Demit-xcframework=false \
            -Doptimize=ReleaseFast
          test -f zig-out/lib/libghostty-vt.a

      - name: Architecture guard
        run: scripts/check-architecture.sh

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版。

            ## v0.4.2 · Soft 主题与设置 chrome 一体
            - **Soft Dark / Soft Light**：在 Default 深浅之外增加两套整套预设（Ghostty/One Dark 蓝深底 · Solarized cream + 黑字）；titlebar 跟终端底色一体。
            - **设置页同族配色**：设置窗 chrome 按 effective 主题四套，不再 Soft 终端 + Default 中性灰设置。
            - **跟随系统 + Soft 偏好**：`softDarkPreferred` / `softLightPreferred`；手动四选一。
            - **设置窗标题黏底**：透明 titlebar 隐藏系统 "Settings" 标题，show/侧栏切换后 re-assert，避免深色下黑字贴底。

            ## 自 v0.4.1
            - 假底部/选区错位/滚动卡死与光标狂闪修复；agent 任务完成通知（默认关，hooks 同意安装）。

            ## 自 v0.4.0
            - Pattern-2 平滑像素滚动、Metal 直绘 expanded grid、浏览时跟随新输出。
            - 最低系统版本 **macOS 14**。
