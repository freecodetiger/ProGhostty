name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    # Zig 0.15.2's build runner fails to link libc on macOS 26 / Xcode 26
    # (undefined _abort/_free/...). Pin until Zig catches up.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          set -euxo pipefail
          uname -a
          swift --version
          xcode-select -p
          xcrun --show-sdk-path
          test -f Vendor/ghostty/build.zig

      - name: Install Zig
        run: |
          set -euxo pipefail
          mkdir -p .tools
          case "$(uname -m)" in
            arm64) ZIG_ARCH=aarch64 ;;
            x86_64) ZIG_ARCH=x86_64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fL "https://ziglang.org/download/0.15.2/zig-${ZIG_ARCH}-macos-0.15.2.tar.xz" -o .tools/zig.tar.xz
          tar -xf .tools/zig.tar.xz -C .tools
          echo "${GITHUB_WORKSPACE}/.tools/zig-${ZIG_ARCH}-macos-0.15.2" >> "$GITHUB_PATH"
          ".tools/zig-${ZIG_ARCH}-macos-0.15.2/zig" version

      - name: Build Ghostty VT
        working-directory: Vendor/ghostty
        run: |
          set -euxo pipefail
          export SDKROOT="$(xcrun --show-sdk-path)"
          zig build \
            --global-cache-dir "${GITHUB_WORKSPACE}/.zig-cache-global" \
            -Demit-lib-vt=true \
            -Demit-xcframework=false \
            -Doptimize=ReleaseFast
          test -f zig-out/lib/libghostty-vt.a

      - name: Architecture guard
        run: scripts/check-architecture.sh

      - name: Test
        run: swift test --no-parallel

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" BUILD="$BUILD" scripts/build-dmg.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ProGhostty ${{ github.ref_name }} 正式版。

            ## v0.4.9 · 程序标题自动上报
            - **自动 pane 标题**：前台程序（vim / ssh / htop / Claude Code…）通过 OSC 上报的窗口标题，现在显示在标题栏的 pane 模块里——切程序即换标题，退出即恢复目录名。
            - 只接受**前台程序**的上报（后台任务不会抢标题）；标题里含 `;` 不再被截断。
            - 设置中可关闭（默认开启）。
            - 标题栏模块改以红绿灯按钮为基准居中，视觉更稳。
            - 内部：删除四份过时的早期文档，修正文档中指向已删类型的引用。

            ## v0.4.8 · 退出确认修复与架构清理
            - **修复：退出确认先于窗口关闭**。窗口内有前台进程时，点关闭按钮或 ⌘Q 现在**先**弹出二次确认——取消则窗口保持打开；此前窗口先消失、弹窗无法取消并反复出现的循环已根除。确认过一次不再重复询问。
            - **内部：架构债清理（四波重构）**。从 AppModel / PTYGridView / TerminalCanvasView 拆出 14 个单一职责类型（标题格式化、确认弹窗、字体目录、分屏可用性、prompt 光标推断、选区模型、窗口尺寸、辅助窗口、外观派生、通知呈现、Agent 通知门控等），设置 schema 去 AppKit 化；测试 611 → 649，行为零变化。

            ## 自 v0.4.6
            - 文件信息卡片（点击路径）、标题栏项目面板（分支/改动/最近提交）、链接交互修复。

            ## 自 v0.4.5
            - URL 语义对象交互：dwell 加粗、圆环光标、点击菜单、裸词路径、⌘ Explore。

            ## 自 v0.4.4
            - 跨行链接 ⌘-click、设置窗标题黏底、Soft Light 正文字纯黑。

            ## 自 v0.4.3
            - 分屏拉伸/错位、reflow 闪动、关分屏崩溃、最后一块分屏误关、历史选区边缘滚动修复。

            ## 自 v0.4.0
            - Pattern-2 平滑像素滚动、Metal 直绘 expanded grid；最低 **macOS 14**。
